name: Template smoke test

on:
  pull_request:
    paths:
      - 'copier.yml'
      - 'template/**'
      - 'tests/template_smoke.py'
      - '.github/workflows/template-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out template
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Copier
        run: python -m pip install 'copier==9.19.1'

      - name: Generate examples and compare symlink models
        shell: bash
        run: |
          set -euo pipefail
          python tests/template_smoke.py
          echo "PASS: Dental Memo and Chessboard Playback; both symlink models, default and preserved Copier behavior; Git checkout and skill access" >> "$GITHUB_STEP_SUMMARY"
